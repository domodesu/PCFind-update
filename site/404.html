<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:40px;color:#444}</style>
    <script>
      (function(){
        try{
          var path = (location.pathname||'/') + (location.search||'') + (location.hash||'');
          var parts = (location.pathname||'/').split('/');
          var repo = parts[1]||'';
          var base = repo ? ('/' + repo + '/') : '/';
          // Redirect to index with hash-based path so it loads without 404
          var target = base + '#' + path;
          location.replace(target);
        }catch(e){ location.replace('./'); }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
  </html>
